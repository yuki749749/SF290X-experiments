defaults:
  - base
  - diffusion_model
  - planner: bo
  - _self_

training:
  n_epochs: 200
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  eta_min: 1.0e-5
  ema_decay: 0.995
  early_stopping_patience: 10

# Optional dataset/training overrides. If set to null (or omitted), 
# they automatically inherit settings from the processed dataset's stats JSON.
# (Note: reward_type can be switched freely between 'rmse' and 'trace_reduction')
horizon: null
stride: null
reward_key: null
reward_type: null

dataset_dir: ???