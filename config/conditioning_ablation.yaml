hydra:
  run:
    dir: results/${hydra.job.name}/run/${now:%Y-%m-%d_%H-%M-%S}/scenario_${scenario_idx}/use_belief=${planner.use_belief},use_return=${planner.use_return}
  sweep:
    dir: results/${hydra.job.name}/sweep/${now:%Y-%m-%d_%H-%M-%S}
    subdir: scenario_${scenario_idx}/use_belief=${planner.use_belief},use_return=${planner.use_return}

defaults:
  - base
  - diffusion_model
  - planner: diffusion
  - _self_

n_timesteps: 100
scenario_idx: 0
