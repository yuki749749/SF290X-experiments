hydra:
  run:
    dir: results/${hydra.job.name}/run/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: results/${hydra.job.name}/sweep/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.override_dirname}

defaults:
  - base
  - diffusion_model
  - planner: diffusion
  - _self_

# ── Analysis settings ─────────────────────────────────────────────────────────
n_samples: 100
initial_position: [7.5, 0.0]
initial_heading: 1.5707963268   # pi/4

# ── Known region (partial belief initialisation) ──────────────────────────────
# The GP is seeded with n_side² observations on a uniform grid inside this box.
known_region:
  min: [7.5, 0.0]
  max: [15.0, 15.0]
  n_side: 10            # 10×10 = 100 training points

# ── Scenario ──────────────────────────────────────────────────────────────────
scenario:
  source_x: 10.0
  source_y: 10.0
  intensity: 0.0
