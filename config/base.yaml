hydra:
  run:
    dir: results/${hydra.job.name}/run/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: results/${hydra.job.name}/sweep/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.override_dirname}


# ── Environment ───────────────────────────────────────────────────────────────
domain_min: [0.0, 0.0]
domain_max: [300.0, 300.0]
domain_size: [300.0, 300.0]
domain_pad: 50.0
diffusion_coefficient: 40.0
source_range: [1, 3]
intensity_range: [50, 200]
sigma: 0.5
seed: 42
planner_seed: 1042
n_scenarios: 1
start_scenario_idx: 0
n_jobs: -1
joblib_backend: loky


# ── Evaluation grid ────────────────────────────────────────────────────────────
n_evaluations: 1600        # 40²
n_visualizations: 1600     # 40²

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  hyperparameters:
    gp: results/gp_tuning/run/2026-08-23_14-20-47/gp_hyperparameters.pkl
  trajectories:
    processed: data/trajectories/processed