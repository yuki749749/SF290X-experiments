defaults:
  - /base
  - base_planner
  - _self_

type: random_bo

# ── Replanning ────────────────────────────────────────────────────────────────
replan_every: 8          # replan after this many executed steps
horizon: 16

# ── BO acquisition ────────────────────────────────────────────────────────────
n_samples: 100           # K candidate trajectories sampled per replan
acquisition: wivr        # "wivr", "ucb", "variance", or "std"
wivr_weighting: plume    # "hybrid", "plume" (1 + beta*mu), "uncertainty", or "uniform"
wivr_grid_size: 20       # side length of evaluation grid (20x20 = 400 points)
beta: 10.0               # multiplier on max(0, mu) for plume weighting
gamma: 1.0               # discount factor along future waypoints (1.0 = undiscounted)
boundary_penalty: 0.0    # 0.0 = rely strictly on position-level masking (no penalty)
gp_mean_constant: 0.0    # prior mean of GP (0.0 = ambient ocean background)
arc_prob: 0.5            # fraction of constant curvature arcs vs stochastic turns

# ── Sampling ──────────────────────────────────────────────────────────────────
device: null             # null → auto (cuda if available, else cpu)
