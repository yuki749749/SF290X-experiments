defaults:
  - /base
  - base_planner
  - _self_

type: diffusion
checkpoint_path: models/best_checkpoint.pt
replan_every: 4
target_return: 1.0
device: null                # null → auto (cuda if available, else cpu)

warm_start: True
noise_steps: 10
use_belief: True
use_return: True
use_egocentric: False