defaults:
  - /base
  - base_planner
  - _self_

type: diffusion
checkpoint_path: models/best_checkpoint.pt
replan_every: 8
target_return: 0.5
device: null                # null → auto (cuda if available, else cpu)

warm_start: True
noise_steps: 20
use_belief: True
use_return: True
use_egocentric: False